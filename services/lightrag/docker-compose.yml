services:
  ollama:
    image: ollama/ollama:latest
    environment:
      # 默认 num_parallel=1，并发 embedding 请求会排队导致 LightRAG 60s worker 超时
      - OLLAMA_NUM_PARALLEL=8
      # 避免模型冷启动造成首次 flush 大面积超时
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      # 模型数据存放在项目目录内（services/lightrag/data/ollama_models），
      # 用户可直接在项目中找到所有数据，无需进入 Docker 卷目录。
      - ./data/ollama_models:/root/.ollama
    # 仅容器网络内可达，不暴露到宿主机
    restart: unless-stopped

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    ports:
      - "9621:9621"
    env_file: .env
    extra_hosts:
      # 允许 LLM_BINDING_HOST 指向宿主机服务（备用）
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
    depends_on:
      - ollama
    restart: unless-stopped
